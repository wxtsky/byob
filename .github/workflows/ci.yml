name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      # The bridge and the MCP server run under Node, never bun.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # The plugin ships a committed single-file MCP server; it must match the source.
      - name: Plugin bundle is up to date
        if: runner.os == 'Linux'
        run: bun run build:claude-plugin && git diff --exit-code plugins/byob/servers

  e2e:
    name: e2e (Chrome for Testing)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Install Chrome for Testing
        run: bunx @puppeteer/browsers install chrome@stable --path ~/.cache/byob-e2e
      - name: e2e (TypeScript source)
        run: bun test e2e
        env:
          BYOB_E2E: '1'
      - name: e2e (release bundles)
        run: bun test e2e
        env:
          BYOB_E2E: '1'
          BYOB_E2E_BUNDLE: '1'
      - name: Bridge and Chrome logs on failure
        if: failure()
        run: |
          tail -n 200 ~/.cache/byob-e2e/home/bridge.log || true
          tail -n 100 ~/.cache/byob-e2e/chrome.log || true
