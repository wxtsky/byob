<!doctype html><html><head><meta charset="utf-8"><title>Animation</title>
<style>
  body { margin: 0; font: 16px sans-serif; }
  #box { width: 120px; height: 120px; background: #e6005a; position: absolute; top: 80px; animation: slide 1.2s linear infinite alternate; }
  @keyframes slide { from { left: 20px; } to { left: 600px; } }
</style></head>
<body><h1>Animation</h1><div id="box"></div></body></html>
