<!doctype html><html><head><meta charset="utf-8"><title>Shadow</title></head>
<body><h1>Shadow DOM</h1><open-box></open-box><closed-box></closed-box><p id="out">none</p>
<script>
  customElements.define('open-box', class extends HTMLElement {
    connectedCallback() {
      const r = this.attachShadow({ mode: 'open' });
      r.innerHTML = '<button id="ob">Open shadow button</button>';
      r.getElementById('ob').addEventListener('click', () => { document.getElementById('out').textContent += ' open'; });
    }
  });
  customElements.define('closed-box', class extends HTMLElement {
    connectedCallback() {
      const r = this.attachShadow({ mode: 'closed' });
      r.innerHTML = '<button>Closed shadow button</button>';
      r.querySelector('button').addEventListener('click', () => { document.getElementById('out').textContent += ' closed'; });
    }
  });
</script></body></html>
