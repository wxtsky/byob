<!doctype html><html><head><meta charset="utf-8"><title>App shell fixture</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  #app { display: flex; height: 100%; }
  #side { width: 160px; background: #eee; }
  #main { flex: 1; overflow: auto; }
  .row { height: 120px; border-bottom: 1px solid #ccc; }
</style></head>
<body><div id="app"><nav id="side">Sidebar</nav><main id="main"></main></div>
<script>
  for (let i = 1; i <= 40; i++) {
    const d = document.createElement('div');
    d.className = 'row';
    d.textContent = 'Row ' + i;
    document.getElementById('main').appendChild(d);
  }
</script></body></html>
