<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- byob extension icon: 2×2 grid of B Y O B
       Designed to read clean from 16×16 up to 128×128. -->

  <!-- charcoal rounded tile (matches Chrome's icon container conventions) -->
  <rect width="64" height="64" rx="14" fill="#0a0a0a"/>

  <!-- subtle green crosshair: divider hint + lock-on accent -->
  <line x1="32" y1="14" x2="32" y2="50" stroke="#22c55e" stroke-width="1.2" opacity="0.55"/>
  <line x1="14" y1="32" x2="50" y2="32" stroke="#22c55e" stroke-width="1.2" opacity="0.55"/>

  <!-- 4 letters at quadrant centers -->
  <g font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace"
     font-size="22"
     font-weight="800"
     fill="#ffffff"
     text-anchor="middle"
     dominant-baseline="central">
    <text x="20" y="20">B</text>
    <text x="44" y="20">Y</text>
    <text x="20" y="44">O</text>
    <text x="44" y="44">B</text>
  </g>
</svg>
