<svg viewBox="0 0 480 160" xmlns="http://www.w3.org/2000/svg">
  <!-- README / GitHub social-card banner
       Mark on the left (BYOB 2×2) + wordmark on the right + tagline. -->
  <rect width="480" height="160" rx="20" fill="#0a0a0a"/>

  <!-- ── 2×2 mark ── -->
  <g transform="translate(28 28)">
    <!-- 100×100 mark zone -->
    <rect width="100" height="100" rx="18" fill="#0a0a0a" stroke="#22c55e" stroke-width="1.2" opacity="0.55"/>
    <line x1="50" y1="14" x2="50" y2="86" stroke="#22c55e" stroke-width="1.2" opacity="0.55"/>
    <line x1="14" y1="50" x2="86" y2="50" stroke="#22c55e" stroke-width="1.2" opacity="0.55"/>
    <g font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace"
       font-size="34"
       font-weight="800"
       fill="#ffffff"
       text-anchor="middle"
       dominant-baseline="central">
      <text x="32" y="32">B</text>
      <text x="68" y="32">Y</text>
      <text x="32" y="68">O</text>
      <text x="68" y="68">B</text>
    </g>
  </g>

  <!-- ── wordmark + tagline ── -->
  <g transform="translate(160 0)">
    <text x="0" y="78"
          font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace"
          font-size="56"
          font-weight="800"
          fill="#ffffff">byob</text>
    <text x="2" y="106"
          font-family="ui-sans-serif, system-ui, -apple-system, sans-serif"
          font-size="13"
          font-weight="500"
          fill="#a1a1aa"
          letter-spacing="3">BRING YOUR OWN BROWSER</text>
    <text x="2" y="128"
          font-family="ui-sans-serif, system-ui, -apple-system, sans-serif"
          font-size="11"
          font-weight="400"
          fill="#52525b">a local-only browser bridge for AI agents</text>
  </g>
</svg>
